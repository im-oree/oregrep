[package]
name = "oregrep"
version = "0.1.0"
edition = "2021"
authors = ["ORE"]
description = "Powerful all-in-one file, code, and codebase manipulation CLI"

[[bin]]
name = "ore"
path = "src/main.rs"

[features]
default = []
keyring-backend = ["keyring"]

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Regex + text search
regex = "1.11"
aho-corasick = "1.1"

# File walking + gitignore-aware
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"

# Encoding detection + conversion
encoding_rs = "0.8"
encoding_rs_io = "0.1"
chardetng = "0.1"

# Diff engine
similar = { version = "2.6", features = ["inline"] }

# Terminal output + color
colored = "2.1"
crossterm = "0.28"

# TUI
ratatui = "0.29"
rustyline = "14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Data formats
serde_yaml = "0.9"
quick-xml = { version = "0.36", features = ["serialize"] }
csv = "1.3"
jsonpath_lib = "0.3"
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# File system helpers
tempfile = "3.14"

# Clipboard
arboard = "3.4"

# Hashing
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1.4"

# Utilities
chrono = "0.4"
byte-unit = "5.1"

# Process orchestration
which = "6.0"
notify = "6.1"

# Fuzzy matching
strsim = "0.11"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "cookies",
    "multipart",
    "stream",
    "socks",
    "http2",
    "charset",
] }

# WebSocket
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# Progress bars
indicatif = "0.17"

# SQLite index
rusqlite = { version = "0.32", features = ["bundled"] }

# URL parsing
url = "2.5"

# HTML parsing (for `crawl` to extract links)
scraper = "0.20"

# Binary / hex
base64 = "0.22"

# Image / SVG conversion
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
webp = "0.3"

# Browser automation
headless_chrome = "1.0"

# AI integration
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-stream = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
keyring = { version = "3", optional = true }
urlencoding = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true